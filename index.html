<div class="password-checker">

    <label for="inputPassword">
        🔍 तुमचा Password तपासा
    </label>

    <div class="input-password-box">

        <input
            type="password"
            id="inputPassword"
            placeholder="तुमचा Password येथे टाका"
            autocomplete="off"
        >

        <button id="togglePassword" type="button">
            👁️
        </button>

    </div>

    <div class="strength-container">

        <div class="strength-bar">
            <div
                id="inputStrengthBar"
                class="strength-progress"
            ></div>
        </div>

        <span id="inputStrengthText">
            Password Strength
        </span>

    </div>

    <button
        id="hashButton"
        class="generate-button"
        type="button"
    >
        🔐 Generate SHA-256 Hash
    </button>

    <div class="password-box hash-output">

        <input
            type="text"
            id="hashOutput"
            readonly
            placeholder="Generated hash येथे दिसेल"
        >

        <button
            id="copyHashButton"
            type="button"
        >
            📋 Copy
        </button>

    </div>

</div>
