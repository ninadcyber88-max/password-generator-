<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberShield // Password Security Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-cyan-500 selection:text-slate-950 flex items-center justify-center p-4 relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <!-- Glow Effects -->
  <div class="absolute top-1/4 -left-32 w-96 h-96 bg-cyan-500/10 rounded-full blur-[128px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-teal-500/10 rounded-full blur-[128px] pointer-events-none"></div>

  <main class="w-full max-w-lg border border-cyan-500/20 bg-slate-900/80 backdrop-blur-xl rounded-2xl p-6 sm:p-8 shadow-[0_0_40px_rgba(6,182,212,0.1)] relative z-10 space-y-8">
    
    <!-- Header -->
    <header class="space-y-1 text-center">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider uppercase font-mono bg-gradient-to-r from-teal-400 via-cyan-400 to-sky-500 bg-clip-text text-transparent drop-shadow-[0_0_20px_rgba(34,211,238,0.4)]">
        CyberShield
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 font-mono tracking-wide">
        // Real-Time Password Auditor & Keygen
      </p>
    </header>

    <!-- Password Analyzer -->
    <section class="space-y-3">
      <div class="flex justify-between items-center text-xs font-mono uppercase tracking-wider text-slate-400">
        <label for="password-input">Audit Target</label>
        <span id="strength-label" class="font-semibold hidden"></span>
      </div>

      <input
        id="password-input"
        type="text"
        placeholder="Enter password to evaluate..."
        class="w-full px-4 py-3 bg-slate-950/70 border border-slate-700/80 rounded-lg text-slate-100 placeholder-slate-500 text-sm font-mono focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
        autocomplete="off"
        spellcheck="false"
      />

      <div id="meter-container" class="space-y-1 pt-1 hidden">
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div id="meter-bar" class="h-full transition-all duration-300"></div>
        </div>
      </div>
    </section>

    <!-- Divider -->
    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-4 text-slate-600 font-mono text-xs uppercase tracking-widest">
        Cryptographic Keygen
      </span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Password Generator -->
    <section class="space-y-4">
      <button
        id="generate-btn"
        type="button"
        class="w-full py-3 px-4 bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-400 hover:to-cyan-400 text-slate-950 font-mono font-bold text-sm tracking-wider uppercase rounded-lg transition-all duration-200 shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.5)] active:scale-[0.99]"
      >
        Generate Secure Key
      </button>

      <div id="generated-box" class="hidden items-center gap-2 p-2 bg-slate-950/90 border border-cyan-500/30 rounded-lg shadow-inner">
        <input
          id="generated-input"
          type="text"
          readonly
          class="w-full bg-transparent px-2 text-sm sm:text-base font-mono text-cyan-300 outline-none select-all"
        />
        <button
          id="copy-btn"
          type="button"
          class="px-4 py-2 rounded-md font-mono text-xs font-semibold uppercase tracking-wider transition-all duration-150 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30"
        >
          Copy
        </button>
      </div>
    </section>
  </main>

  <script>
    const passwordInput = document.getElementById('password-input');
    const strengthLabel = document.getElementById('strength-label');
    const meterContainer = document.getElementById('meter-container');
    const meterBar = document.getElementById('meter-bar');
    const generateBtn = document.getElementById('generate-btn');
    const generatedBox = document.getElementById('generated-box');
    const generatedInput = document.getElementById('generated-input');
    const copyBtn = document.getElementById('copy-btn');

    passwordInput.addEventListener('input', (e) => {
      const pwd = e.target.value;
      if (!pwd) {
        strengthLabel.classList.add('hidden');
        meterContainer.classList.add('hidden');
        return;
      }

      const length = pwd.length;
      const hasLetters = /[a-zA-Z]/.test(pwd);
      const hasNumbers = /[0-9]/.test(pwd);
      const hasSymbols = /[^a-zA-Z0-9]/.test(pwd);

      let level = 'Weak';
      let colorClass = 'text-rose-400';
      let barClass = 'w-1/3 bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.6)]';

      if (length > 12 && hasLetters && hasNumbers && hasSymbols) {
        level = 'Strong';
        colorClass = 'text-emerald-400';
        barClass = 'w-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.6)]';
      } else if (hasLetters && hasNumbers && length >= 8) {
        level = 'Medium';
        colorClass = 'text-amber-400';
        barClass = 'w-2/3 bg-amber-400 shadow-[0_0_12px_rgba(251,191,36,0.6)]';
      }

      strengthLabel.textContent = `STATUS: ${level}`;
      strengthLabel.className = `font-semibold ${colorClass}`;
      strengthLabel.classList.remove('hidden');

      meterBar.className = `h-full transition-all duration-300 ${barClass}`;
      meterContainer.classList.remove('hidden');
    });

    generateBtn.addEventListener('click', () => {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
      const array = new Uint32Array(16);
      crypto.getRandomValues(array);
      const pwd = Array.from(array, (x) => chars[x % chars.length]).join('');

      generatedInput.value = pwd;
      generatedBox.classList.remove('hidden');
      generatedBox.classList.add('flex');
    });

    copyBtn.addEventListener('click', async () => {
      if (!generatedInput.value) return;
      await navigator.clipboard.writeText(generatedInput.value);
      copyBtn.textContent = 'Copied';
      copyBtn.className = 'px-4 py-2 rounded-md font-mono text-xs font-semibold uppercase tracking-wider transition-all duration-150 bg-emerald-500/20 text-emerald-300 border border-emerald-500/50';
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.className = 'px-4 py-2 rounded-md font-mono text-xs font-semibold uppercase tracking-wider transition-all duration-150 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30';
      }, 2000);
    });
  </script>
</body>
</html>
